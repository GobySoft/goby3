# Same as repeat_for_each.pb.cfg, with for_each entries written as YAML maps
endpoint: [{ name: u, udpm: { platform: pstest_udpm, multicast_port: 11198 } }]
test:
  name: repeat and for_each (yaml)
  default_timeout: 2
  run:
    - name: same input
      repeat: 2
      publish: [{ group: g, type: JSON/Status, value: '{"n": ${ITERATION}}', delay: 0.1 }]
      expect: [{ group: g, type: JSON/Status, match: '{"n": ${ITERATION}}' }]
    - name: heading ${HEADING} is ${DIR}
      for_each:
        - { HEADING: 0, DIR: N }
        - { HEADING: 90, DIR: E }
      publish: [{ group: h, type: JSON/Heading, value: '{"heading": ${HEADING}, "dir": "${DIR}"}', delay: 0.1 }]
      expect: [{ group: h, type: JSON/Heading, match: '{"dir": "${DIR}"}', condition: [{ field: heading, op: EQ, value: "${HEADING}" }] }]
