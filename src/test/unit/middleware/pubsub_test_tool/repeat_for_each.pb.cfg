# Repeated and parameterized runs. The fixture's command also checks that validation skips a
# wrapper's options (setsid --fork) when finding the program it runs.
endpoint { name: "u" udpm { platform: "pstest_udpm" multicast_port: 11198 } }
fixture {
    name: "wrapped"
    command: "setsid --fork sleep 300; echo up; exec sleep 300"
    ready { output_regex: "up" }
}
test {
    name: "repeat and for_each"
    default_timeout: 2
    run {
        name: "same input"
        repeat: 2
        publish { group: "g" type: "JSON/Status" value: "{\"n\": ${ITERATION}}" delay: 0.1 }
        expect { group: "g" type: "JSON/Status" match: "{\"n\": ${ITERATION}}" }
    }
    run {
        name: "heading ${HEADING} is ${DIR}"
        for_each { var { key: "HEADING" value: "0" } var { key: "DIR" value: "N" } }
        for_each { var { key: "HEADING" value: "90" } var { key: "DIR" value: "E" } }
        publish {
            group: "h" type: "JSON/Heading"
            value: "{\"heading\": ${HEADING}, \"dir\": \"${DIR}\", \"note\": \"$${DIR}\"}"
            delay: 0.1
        }
        expect {
            group: "h" type: "JSON/Heading"
            match: "{\"dir\": \"${DIR}\", \"note\": \"$${DIR}\"}"
            condition { field: "heading" op: EQ value: "${HEADING}" }
        }
    }
}
