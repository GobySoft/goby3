      scheme: PROTOBUF
      type: goby::middleware::protobuf::gpsd::Attitude
      thread: goby::apps::zeromq::GPSDClient
    - group: goby::middleware::groups::gpsd::sky
      scheme: PROTOBUF
      type: goby::middleware::protobuf::gpsd::SkyView
      thread: goby::apps::zeromq::GPSDClient
    - group: goby::middleware::groups::gpsd::tpv
      scheme: PROTOBUF
      type: goby::middleware::protobuf::gpsd::TimePositionVelocity
      thread: goby::apps::zeromq::GPSDClient
    - group: goby::health::response
      scheme: PROTOBUF
      type: goby::middleware::protobuf::ProcessHealth
      thread: "goby::middleware::HealthMonitorThread<struct goby::zeromq::detail::InterProcessTag>"
    - group: goby::configuration
      scheme: PROTOBUF
      type: goby::apps::zeromq::protobuf::GPSDConfig
      thread: goby::apps::zeromq::GPSDClient
    - group: goby::terminate::response
      scheme: PROTOBUF
      type: goby::middleware::protobuf::TerminateResponse
      thread: goby::apps::zeromq::GPSDClient
  subscribes:
    - group: goby::health::request
      scheme: PROTOBUF
      type: goby::middleware::protobuf::HealthRequest
      necessity: optional
      thread: "goby::middleware::HealthMonitorThread<struct goby::zeromq::detail::InterProcessTag>"
    - group: goby::datum_update
      scheme: PROTOBUF
      type: goby::middleware::protobuf::DatumUpdate
      necessity: optional
      thread: goby::apps::zeromq::GPSDClient
    - group: goby::terminate::request
      scheme: PROTOBUF
      type: goby::middleware::protobuf::TerminateRequest
      necessity: optional
      thread: goby::apps::zeromq::GPSDClient
interthread:
  threads:
    - name: goby::apps::zeromq::GPSDClient
      known: true
      bases:
        - goby::middleware::Application<class goby::apps::zeromq::protobuf::GPSDConfig>
