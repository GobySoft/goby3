syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/udpm/protobuf/interprocess_config.proto";

package goby.test.middleware.protobuf;

message DynamicGroupsConfig
{
    optional goby.middleware.protobuf.AppConfig app = 1;
    optional goby.udpm.protobuf.InterProcessPortalConfig interprocess = 2;
    optional uint32 modem_id = 3;
    optional string runtime_group = 4;
}

message DynamicGroupsStatus
{
    optional int32 value = 1;
}
