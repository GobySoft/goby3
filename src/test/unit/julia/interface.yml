# Interface for the Julia bindings compile test. Deliberately exercises both a publication and
# a subscription, so that both generated macros are compiled.
application:
  name: GobyJuliaTestApp
  cpp_type: goby::zeromq::SingleThreadApplication
  config:
    scheme: PROTOBUF
    type: goby.test.julia.protobuf.TestConfig

interprocess:
  publishes:
    - group: goby::test::julia::groups::tx
      scheme: PROTOBUF
      type: goby.test.julia.protobuf.CommsTx
  subscribes:
    - group: goby::test::julia::groups::rx
      scheme: PROTOBUF
      type: goby.test.julia.protobuf.CommsRx

# Implemented by Goby.jl between Julia tasks, so none of this reaches the generated C++; the
# generator turns it into the contract in the Julia module and the manifest beside it instead
interthread:
  publishes:
    - group: status
      scheme: NATIVE
      type: Any
      thread: Main
  subscribes:
    - group: status
      scheme: NATIVE
      type: Any
      thread: Worker
      necessity: required
      capacity: 5
      overflow: drop_oldest
