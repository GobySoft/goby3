endpoint { name: "u" udpm { platform: "pstest_udpm" multicast_port: 11198 } }
fixture {
    name: "one_node"
    command: "echo '[node1] All processes running'; exec sleep 300"
    ready {
        output_regex: "\\[node1\\] All processes running"
        output_regex: "\\[node2\\] All processes running"
        timeout: 1
    }
}
test {
    name: "only one readiness pattern matches"
    run { name: "never runs" wait: 0.1 }
}
