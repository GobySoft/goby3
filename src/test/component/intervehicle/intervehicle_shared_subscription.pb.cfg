# Two local subscribers (e.g. gobyd's own InterVehiclePortal and an application's
# InterVehicleForwarder) subscribing to the same type and group from the same publisher queue two
# equivalent subscriptions. Only the newer one is sent, but its ack is reported for both, so each
# subscriber sees its own subscription acknowledged. As in intervehicle_supersede.pb.cfg, the test
# publishes the subscriptions straight onto modem_subscription_forward_tx of modem 1's gobyd and
# watches its driver's acks (modem_ack_in) and expiries (modem_expire_in); modem 2's gobyd
# acknowledges whatever it receives over the link.
fixture {
    name: "gobyd_a"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv_shared_a\"' --intervehicle 'link { modem_id: 1 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_SHARED_PORT:-23235} } } mac { type: MAC_FIXED_DECENTRALIZED slot { src: 1 slot_seconds: 0.5 } slot { src: 2 slot_seconds: 0.5 } } }'"
    ready { delay: 0.5 }
}
fixture {
    name: "gobyd_b"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv_shared_b\"' --intervehicle 'link { modem_id: 2 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_SHARED_PORT:-23235} } } mac { type: MAC_FIXED_DECENTRALIZED slot { src: 1 slot_seconds: 0.5 } slot { src: 2 slot_seconds: 0.5 } } }'"
    ready { delay: 0.5 }
}

endpoint { name: "a" zeromq { platform: "pstest_iv_shared_a" } }

test {
    name: "intervehicle shared subscription"
    default_timeout: 5
    require_app { endpoint: "a" name: "gobyd" timeout: 10 }

    run {
        # published together so both are queued before modem 1's next slot; the acks carry
        # each subscription's own time, so each subscriber can match its own
        name: "the ack of the subscription sent is reported for both subscribers"
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } time: 1000000 action: SUBSCRIBE dccl_id: 200 group: 7"
        }
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } time: 2000000 action: SUBSCRIBE dccl_id: 200 group: 7"
        }
        expect {
            group: "goby::middleware::intervehicle::modem_ack_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.AckMessagePair"
            count: 1
            condition { field: "serializer.key.serialize_time" op: EQ value: "1000000" }
            condition { field: "data.header.src" op: EQ value: "2" }
        }
        expect {
            group: "goby::middleware::intervehicle::modem_ack_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.AckMessagePair"
            count: 1
            condition { field: "serializer.key.serialize_time" op: EQ value: "2000000" }
            condition { field: "data.header.src" op: EQ value: "2" }
        }
        expect {
            group: "goby::middleware::intervehicle::modem_expire_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
            count: 0
        }
    }
}
