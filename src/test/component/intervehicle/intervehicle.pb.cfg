# Intervehicle publish/subscribe between two gobyds, as two vehicles, over a UDP multicast link.
# Each endpoint goes through its own gobyd (modem 1 or modem 2), as an application would.
load_shared_library: "${PSTEST_IV_LIBRARY}"

fixture {
    name: "gobyd_a"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv_a\"' --intervehicle 'link { modem_id: 1 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_LINK_PORT:-23233} max_frame_size: 64 } } mac { type: MAC_FIXED_DECENTRALIZED slot { src: 1 slot_seconds: 0.5 } slot { src: 2 slot_seconds: 0.5 } } }'"
    ready { delay: 0.5 }
}
fixture {
    name: "gobyd_b"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv_b\"' --intervehicle 'link { modem_id: 2 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_LINK_PORT:-23233} max_frame_size: 64 } } mac { type: MAC_FIXED_DECENTRALIZED slot { src: 1 slot_seconds: 0.5 } slot { src: 2 slot_seconds: 0.5 } } }'"
    ready { delay: 0.5 }
}

endpoint { name: "a" layer: LAYER_INTERVEHICLE zeromq { platform: "pstest_iv_a" } }
endpoint { name: "b" layer: LAYER_INTERVEHICLE zeromq { platform: "pstest_iv_b" } }
# vehicle b's interprocess layer, where b's subscriptions republish what they receive if asked to
endpoint { name: "b_ipc" zeromq { platform: "pstest_iv_b" } }

test {
    name: "intervehicle"
    default_timeout: 8
    require_app { endpoint: "a" name: "gobyd" timeout: 10 }
    require_app { endpoint: "b" name: "gobyd" timeout: 10 }

    # b's subscriptions (one per group) are forwarded to modem 1 (publisher_id) before the first
    # run; its publish waits long enough for them to cross the link
    run {
        name: "a message in a numeric group crosses the link"
        publish {
            endpoint: "a" group: "7" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 1"
            delay: 3
        }
        expect {
            endpoint: "b" group: "7" group_field: "group"
            type: "goby.test.middleware.protobuf.IntervehicleSample"
            intervehicle { publisher_id: 1 }
            count: 1 match: "value: 1 group: 7"
        }
        # republish_on_receive is off by default
        expect { endpoint: "b_ipc" group: "7" type: ".*IntervehicleSample" count: 0 }
    }

    run {
        name: "an acknowledged publication reports its ack"
        publish {
            endpoint: "a" group: "8" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 2"
            intervehicle { buffer { ack_required: true } }
        }
        expect {
            endpoint: "b" group: "8" group_field: "group"
            type: "goby.test.middleware.protobuf.IntervehicleSample"
            intervehicle { publisher_id: 1 }
            count: 1
        }
        expect {
            endpoint: "a" group: "8" type: "PROTOBUF/goby.middleware.intervehicle.protobuf.AckData"
            count: 1
        }
    }

    run {
        # published together, so all three are queued before a's next slot; each one with
        # clear_pending replaces the queued ones, leaving only the last to send (#282)
        name: "clear_pending sends only the newest queued message"
        publish {
            endpoint: "a" group: "9" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 3"
            intervehicle { buffer { ack_required: true } clear_pending: true }
        }
        publish {
            endpoint: "a" group: "9" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 4"
            intervehicle { buffer { ack_required: true } clear_pending: true }
        }
        publish {
            endpoint: "a" group: "9" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 5"
            intervehicle { buffer { ack_required: true } clear_pending: true }
        }
        expect {
            endpoint: "b" group: "9" group_field: "group"
            type: "goby.test.middleware.protobuf.IntervehicleSample"
            intervehicle { publisher_id: 1 }
            count: 1 match: "value: 5"
        }
        expect {
            endpoint: "a" group: "9" type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireData"
            count: 2
            condition { field: "reason" op: EQ value: "EXPIRED_SUPERSEDED" }
        }
    }

    run {
        name: "republish_on_receive publishes a received message on the subscriber's inner layer"
        publish {
            endpoint: "a" group: "10" group_field: "group"
            type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample" value: "value: 6"
        }
        expect {
            endpoint: "b" group: "10" group_field: "group"
            type: "goby.test.middleware.protobuf.IntervehicleSample"
            intervehicle { publisher_id: 1 republish_on_receive: true }
            count: 1
        }
        expect {
            endpoint: "b_ipc" group: "10" type: "DCCL/goby.test.middleware.protobuf.IntervehicleSample"
            count: 1 match: "value: 6 group: 10"
        }
    }
}
