# A queued intervehicle subscription that a newer one with the opposite action replaces is dropped
# and reported as EXPIRED_SUPERSEDED (#282); one with the same action (e.g. from another local
# subscriber) is carried by the newer one and shares its fate. gobyd's intervehicle link has no MAC
# slots, so nothing is ever sent and every subscription stays queued. The test publishes straight
# onto the interprocess group the link's driver thread uses (modem_subscription_forward_tx),
# standing in for the InterVehiclePortal of a local application, and watches the driver's expiries
# (modem_expire_in): intervehicle endpoints don't report the acks and expiries of subscriptions.
# clear_pending is tested end to end in intervehicle.pb.cfg, and the acks of a shared subscription
# in intervehicle_shared_subscription.pb.cfg.
fixture {
    name: "gobyd_iv"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv\"' --intervehicle 'link { modem_id: 1 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_PORT:-23231} } } }'"
    ready { delay: 0.5 }
}

endpoint { name: "iv" zeromq { platform: "pstest_iv" } }

test {
    name: "intervehicle supersede"
    default_timeout: 3
    require_app { endpoint: "iv" name: "gobyd" timeout: 10 }

    run {
        # group 6 sits between the two group 5 subscriptions; only the first group 5 one is
        # replaced, so exactly one expire is reported
        name: "a newer subscription replaces the queued one for the same type and group"
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: SUBSCRIBE dccl_id: 3 group: 5"
            delay: 0.2
        }
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: SUBSCRIBE dccl_id: 3 group: 6"
            delay: 0.4
        }
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: UNSUBSCRIBE dccl_id: 3 group: 5"
            delay: 0.6
        }
        expect {
            group: "goby::middleware::intervehicle::modem_expire_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
            count: 1
            condition { field: "data.reason" op: EQ value: "EXPIRED_SUPERSEDED" }
            condition { field: "data.header.dest[0]" op: EQ value: "2" }
        }
    }

    run {
        # the two subscriptions differ only in time, as those of two local subscribers would
        name: "an equivalent subscription from another subscriber stands in for the queued one"
        step {
            name: "neither subscription is expired"
            publish {
                group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
                type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
                value: "api_version: 1 header { src: 1 dest: 2 } time: 1000000 action: SUBSCRIBE dccl_id: 3 group: 7"
            }
            publish {
                group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
                type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
                value: "api_version: 1 header { src: 1 dest: 2 } time: 2000000 action: SUBSCRIBE dccl_id: 3 group: 7"
                delay: 0.2
            }
            expect {
                group: "goby::middleware::intervehicle::modem_expire_in"
                type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
                count: 0
                timeout: 1.5
            }
        }
        step {
            name: "an unsubscribe expires the subscription it replaces and the one it stood in for"
            publish {
                group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
                type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
                value: "api_version: 1 header { src: 1 dest: 2 } time: 3000000 action: UNSUBSCRIBE dccl_id: 3 group: 7"
                delay: 0.2
            }
            expect {
                group: "goby::middleware::intervehicle::modem_expire_in"
                type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
                count: 2
                condition { field: "data.reason" op: EQ value: "EXPIRED_SUPERSEDED" }
                condition { field: "data.header.dest[0]" op: EQ value: "2" }
            }
        }
    }
}
