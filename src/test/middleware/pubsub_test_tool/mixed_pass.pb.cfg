# A zeromq endpoint and a udpm endpoint in one test; each only sees its own traffic
endpoint { name: "z" zeromq { platform: "pstest_a" } }
endpoint { name: "u" udpm { platform: "pstest_udpm" multicast_port: 11198 } }

test {
    name: "mixed transports"
    default_timeout: 2
    require_app { endpoint: "z" name: "gobyd" timeout: 10 }
    run {
        name: "both transports in parallel"
        mode: PARALLEL
        step {
            name: "zeromq"
            publish {
                endpoint: "z" group: "g" type: "goby.middleware.protobuf.LatLonPoint"
                value: "lat: 1 lon: 2" delay: 0.3
            }
            expect { endpoint: "z" group: "g" type: ".*LatLonPoint" min_count: 1 match: "lat: 1" }
            expect { endpoint: "u" group: "g" type: ".*LatLonPoint" count: 0 timeout: 1 match: "lat: 1" }
        }
        step {
            name: "udpm"
            publish {
                endpoint: "u" group: "g" type: "goby.middleware.protobuf.LatLonPoint"
                value: "lat: 3 lon: 4" delay: 0.3
            }
            expect { endpoint: "u" group: "g" type: ".*LatLonPoint" min_count: 1 match: "lat: 3" }
            expect { endpoint: "z" group: "g" type: ".*LatLonPoint" count: 0 timeout: 1 match: "lat: 3" }
        }
    }
}
