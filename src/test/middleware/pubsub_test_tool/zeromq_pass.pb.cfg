include: "zeromq_daemons.pb.cfg"
# Two interprocess daemons plus an intermodule daemon; traffic must stay on its own endpoint
endpoint { name: "a" zeromq { platform: "pstest_a" } }
endpoint { name: "b" zeromq { platform: "pstest_b" } }
endpoint { name: "mod" layer: LAYER_INTERMODULE zeromq { platform: "pstest_mod" } }

test {
    name: "zeromq pass"
    default_timeout: 3
    require_app { endpoint: "a" name: "gobyd" timeout: 10 }
    require_app { endpoint: "b" name: "gobyd" timeout: 10 }
    run {
        name: "protobuf round trip with match and condition"
        publish {
            endpoint: "a" group: "nav" type: "goby.middleware.protobuf.LatLonPoint"
            value: "lat: 42.5 lon: -70.3" delay: 0.2
        }
        expect {
            endpoint: "a" group: "nav" type: "PROTOBUF/goby.middleware.protobuf.LatLonPoint"
            min_count: 1 match: "lat: 42.5"
            condition { field: "lon" op: LT value: "0" }
        }
        expect { endpoint: "b" group: "nav" type: ".*" count: 0 timeout: 1 }
    }
    run {
        name: "intermodule and json in parallel"
        mode: PARALLEL
        step {
            name: "intermodule"
            publish {
                endpoint: "mod" group: "g" type: "goby.middleware.protobuf.LatLonPoint"
                value: "lat: 1 lon: 2" delay: 0.2
            }
            expect { endpoint: "mod" group: "g" type: ".*LatLonPoint" min_count: 1 match: "lat: 1" }
        }
        step {
            name: "json"
            publish {
                endpoint: "b" group: "j" type: "JSON/Status" value: "{\"x\": 1, \"s\": \"ok\"}"
                repeat: 3 interval: 0.1 delay: 0.2
            }
            expect {
                endpoint: "b" group: "j" type: "JSON/Status" count: 3 match: "{\"s\": \"ok\"}"
                timeout: 1.5
            }
        }
    }
}
