# The fixture starts a daemon in a new session (outside its process group) and records its PID;
# goby test must still stop it, since it reparents to goby test as the subreaper
endpoint { name: "u" udpm { platform: "pstest_udpm" multicast_port: 11198 } }
fixture {
    name: "daemonizer"
    command: "setsid sleep 300 & echo $! > ${PIDFILE}; echo up; exec sleep 300"
    ready { output_regex: "^up$" timeout: 5 }
}
test {
    name: "fixture cleanup"
    run { name: "pause" wait: 0.2 }
}
