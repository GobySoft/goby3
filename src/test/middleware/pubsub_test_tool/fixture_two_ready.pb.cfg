# Ready only once both patterns have matched: the first is printed twice before the second, which
# must not count as both
endpoint { name: "u" udpm { platform: "pstest_udpm" multicast_port: 11198 } }
fixture {
    name: "two_nodes"
    command: "echo '[node1] All processes running'; echo '[node1] All processes running'; sleep 1; echo '[node2] All processes running'; exec sleep 300"
    ready {
        output_regex: "\\[node1\\] All processes running"
        output_regex: "\\[node2\\] All processes running"
        timeout: 5
    }
}
test {
    name: "two readiness patterns"
    run { name: "pause" wait: 0.1 }
}
