# Queued intervehicle messages that a newer one replaces are dropped and reported as
# EXPIRED_SUPERSEDED (#282). gobyd's intervehicle link has no MAC slots, so nothing is ever sent
# and every message stays queued. The test publishes straight onto the interprocess groups the
# link's driver thread uses, standing in for the InterVehiclePortal of a local application
# (modem_subscription_forward_tx, modem_data_out) and for a remote subscriber
# (modem_subscription_forward_rx).
fixture {
    name: "gobyd_iv"
    command: "exec gobyd --interprocess 'platform: \"pstest_iv\"' --intervehicle 'link { modem_id: 1 driver { driver_type: DRIVER_UDP_MULTICAST [goby.acomms.udp_multicast.protobuf.config] { multicast_port: ${PSTEST_IV_PORT:-50231} } } }'"
    ready { delay: 0.5 }
}

endpoint { name: "iv" zeromq { platform: "pstest_iv" } }

test {
    name: "intervehicle supersede"
    default_timeout: 3
    require_app { endpoint: "iv" name: "gobyd" timeout: 10 }

    run {
        # group 6 sits between the two group 5 subscriptions; only the first group 5 one is
        # replaced, so exactly one expire is reported
        name: "a newer subscription replaces the queued one for the same type and group"
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: SUBSCRIBE dccl_id: 3 group: 5"
            delay: 0.2
        }
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: SUBSCRIBE dccl_id: 3 group: 6"
            delay: 0.4
        }
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_tx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 1 dest: 2 } action: UNSUBSCRIBE dccl_id: 3 group: 5"
            delay: 0.6
        }
        expect {
            group: "goby::middleware::intervehicle::modem_expire_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
            count: 1
            condition { field: "data.reason" op: EQ value: "EXPIRED_SUPERSEDED" }
            condition { field: "data.header.dest[0]" op: EQ value: "2" }
        }
    }

    run {
        # modem 2 subscribes to group 7, so the link queues group 7 data for it. The first two
        # messages are queued side by side; the third sets clear_pending and replaces both.
        # ReceiveStatistics only provides a DCCL id: the payload is never decoded.
        name: "clear_pending replaces queued data of the same type and group"
        publish {
            group: "goby::middleware::intervehicle::modem_subscription_forward_rx"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.Subscription"
            value: "api_version: 1 header { src: 2 dest: 1 } action: SUBSCRIBE dccl_id: 129 group: 7"
            delay: 0.2
        }
        publish {
            group: "goby::middleware::intervehicle::modem_data_out"
            type: "PROTOBUF/goby.middleware.protobuf.SerializerTransporterMessage"
            value: "key { marshalling_scheme: 2 type: \"goby.acomms.micromodem.protobuf.ReceiveStatistics\" group: \"g7\" group_numeric: 7 serialize_time: 1 } data: \"unsent\""
            delay: 0.4
        }
        publish {
            group: "goby::middleware::intervehicle::modem_data_out"
            type: "PROTOBUF/goby.middleware.protobuf.SerializerTransporterMessage"
            value: "key { marshalling_scheme: 2 type: \"goby.acomms.micromodem.protobuf.ReceiveStatistics\" group: \"g7\" group_numeric: 7 serialize_time: 2 } data: \"kept\""
            delay: 0.6
        }
        publish {
            group: "goby::middleware::intervehicle::modem_data_out"
            type: "PROTOBUF/goby.middleware.protobuf.SerializerTransporterMessage"
            value: "key { marshalling_scheme: 2 type: \"goby.acomms.micromodem.protobuf.ReceiveStatistics\" group: \"g7\" group_numeric: 7 serialize_time: 3 cfg { intervehicle { clear_pending: true } } } data: \"newest\""
            delay: 0.8
        }
        expect {
            group: "goby::middleware::intervehicle::modem_expire_in"
            type: "PROTOBUF/goby.middleware.intervehicle.protobuf.ExpireMessagePair"
            count: 2
            condition { field: "data.reason" op: EQ value: "EXPIRED_SUPERSEDED" }
            # the two older messages, not the one that replaced them
            condition { field: "serializer.key.serialize_time" op: LE value: "2" }
        }
    }
}
