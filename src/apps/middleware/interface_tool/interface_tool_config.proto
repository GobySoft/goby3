syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/protobuf/option_extensions.proto";

package goby.apps.middleware.protobuf;

message InterfaceToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: true
        has_help_action: true
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    enum Action
    {
        help = 0 [(goby.ev).cfg = {
            short_help_msg: "Print usage information",
            full_help_msg: "Usage: \"goby interface help [action]\"\n"
        }];
        visualize = 1 [(goby.ev).cfg = {
            short_help_msg: "Draw a deployment's publish/subscribe graph (Graphviz or D2)"
        }];
        validate = 2 [(goby.ev).cfg = {
            short_help_msg: "Check that every required subscription in a deployment has a publisher"
        }];
    }
    optional Action action = 2 [
        default = help,
        (goby.field) = {
            description: "The action this tool should take [can omit --action if 1st parameter]",
            cfg { position: { enable: true }, cli_short: "A", action: HIDDEN }
        }
    ];
}

message InterfaceVisualizeConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    required string deployment_file = 10 [(goby.field) = {
        description: "Deployment file (deployment.yml), or a single interface file drawn as a one-platform deployment",
        cfg { position: { enable: true } }
    }];
    optional string output_file = 11
        [(goby.field).description = "Write the graph here instead of stdout"];

    enum Format
    {
        DOT = 1;
        D2 = 2;
    }
    optional Format format = 14 [
        default = DOT,
        (goby.field) = {
            description: "Graphviz (render with dot) or D2 (render with d2, https://d2lang.com)"
        }
    ];
    repeated string define = 12 [(goby.field) = {
        description: "Set a variable used as ${NAME} in the deployment file, as NAME=value; overrides the environment",
        cfg { cli_short: "D" }
    }];
    repeated string interface_dir = 13 [(goby.field) = {
        description: "Search this directory for interface files, after the deployment file's own directory (also GOBY_INTERFACE_PATH, colon separated)",
        cfg { cli_short: "I" }
    }];

    optional bool no_disconnected = 20 [
        default = false,
        (goby.field).description =
            "Do not draw publications without subscribers or subscriptions without publishers (required subscriptions are always drawn)"
    ];
    optional bool omit_interthread = 21
        [default = false, (goby.field).description = "Do not draw interthread connections"];
    optional string omit_group_regex = 22
        [(goby.field).description = "Do not draw groups matching this regex"];
    optional string omit_node_regex = 23 [(goby.field).description =
                                              "Do not draw platforms, modules, applications or "
                                              "threads whose name matches this regex"];
    optional bool include_terminate = 24
        [default = false, (goby.field).description = "Draw goby_terminate groups"];
    optional bool include_coroner = 25
        [default = false, (goby.field).description = "Draw goby_coroner groups"];
    optional bool include_all = 26 [
        default = false,
        (goby.field).description = "Draw every group, including Goby's internal ones"
    ];
    optional string splines = 27
        [default = "ortho", (goby.field).description = "Graphviz splines= setting"];
    optional bool expand_instances = 28 [
        default = false,
        (goby.field).description =
            "Draw each of a platform's instances: separately, rather than once for all of them"
    ];
}

message InterfaceValidateConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    required string deployment_file = 10 [(goby.field) = {
        description: "Deployment file (deployment.yml), or a single interface file checked as a one-platform deployment",
        cfg { position: { enable: true } }
    }];
    optional string output_file = 11
        [(goby.field).description = "Write the report here instead of stdout"];
    repeated string define = 12 [(goby.field) = {
        description: "Set a variable used as ${NAME} in the deployment file, as NAME=value; overrides the environment",
        cfg { cli_short: "D" }
    }];
    repeated string interface_dir = 13 [(goby.field) = {
        description: "Search this directory for interface files, after the deployment file's own directory (also GOBY_INTERFACE_PATH, colon separated)",
        cfg { cli_short: "I" }
    }];

    enum OutputFormat
    {
        HUMAN = 1;
        JSON = 2;
    }
    optional OutputFormat output_format = 20
        [default = HUMAN, (goby.field) = { cfg { cli_short: "o" } }];
    optional bool strict = 21
        [default = false, (goby.field).description = "Fail on warnings as well as errors"];
    optional bool report_unused = 22 [
        default = false,
        (goby.field).description = "Also report publications that nothing subscribes to"
    ];
    optional bool assume_dynamic = 25 [
        default = false,
        (goby.field).description =
            "Count a dynamic publication whose group's numeric part is set at run time (and not given with bind:) as reaching the subscriptions it might"
    ];
    optional string omit_group_regex = 23
        [(goby.field).description = "Do not check groups matching this regex"];
    optional string omit_node_regex = 24 [(goby.field).description =
                                              "Do not check platforms, modules, applications or "
                                              "threads whose name matches this regex"];
}

// Report written by 'goby interface validate -o JSON'

message InterfaceIssue
{
    enum Severity
    {
        ERROR = 1;
        WARNING = 2;
        INFO = 3;
    }
    required Severity severity = 1;
    required string code = 2 [(goby.field).description = "e.g. required-unmet"];
    required string message = 3;
    optional string location = 4 [(goby.field).description =
                                      "Position in the deployment file, e.g. platforms[0].run[2]"];

    message Subject
    {
        optional string platform = 1;
        optional string module = 2;
        optional string application = 3;
        optional string thread = 4;
        optional string layer = 5;
        optional string group = 6;
        optional string scheme = 7;
        optional string type = 8;
        optional string necessity = 9;
    }
    optional Subject subject = 5 [(goby.field).description =
                                      "The publication or subscription the issue is about"];
}

message InterfaceValidation
{
    required string file = 1;
    required bool valid = 2;
    repeated InterfaceIssue issue = 3;

    message Summary
    {
        optional int32 platforms = 1;
        optional int32 applications = 2;
        optional int32 connections = 3;
        optional int32 required = 4;
        optional int32 required_met = 5;
    }
    optional Summary summary = 4;
}
