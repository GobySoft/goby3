syntax = "proto2";
import "goby/middleware/protobuf/app_config.proto";
import "goby/middleware/protobuf/layer.proto";
import "goby/middleware/protobuf/pubsub_test.proto";
import "goby/protobuf/option_extensions.proto";
import "goby/udpm/protobuf/interprocess_config.proto";
import "goby/zeromq/protobuf/interprocess_config.proto";

package goby.apps.middleware.protobuf;

message TestToolConfig
{
    option (goby.msg).cfg.tool = {
        is_tool: true
        has_subtools: false
        has_help_action: false
    };

    optional goby.middleware.protobuf.AppConfig app = 1
        [(goby.field) = { cfg { action: DEVELOPER } }];

    optional goby.zeromq.protobuf.InterProcessPortalConfig zeromq = 2 [(goby.field) = {
        description: "Default settings for zeromq endpoints; each endpoint's own 'zeromq' settings are layered on top",
        cfg { env: "GOBY_INTERPROCESS" }
    }];
    optional goby.udpm.protobuf.InterProcessPortalConfig udpm = 3 [(goby.field) = {
        description: "Default settings for udpm endpoints; each endpoint's own 'udpm' settings are layered on top"
    }];

    optional string test_file = 10 [(goby.field) = {
        description: "Test file in YAML (.yml/.yaml, when built with yaml-cpp), JSON (.json) or Protobuf TextFormat (other extensions). Its contents are this configuration message (typically 'endpoint' and 'test').",
        cfg { position: { enable: true }, cli_short: "f" }
    }];

    message Endpoint
    {
        required string name = 1;
        optional goby.middleware.protobuf.Layer layer = 2 [default = LAYER_INTERPROCESS];
        oneof transport
        {
            goby.zeromq.protobuf.InterProcessPortalConfig zeromq = 3;
            goby.udpm.protobuf.InterProcessPortalConfig udpm = 4;
        }
    }
    repeated Endpoint endpoint = 11 [(goby.field).description =
                                         "Endpoints referenced by the test. An endpoint with "
                                         "neither 'zeromq' nor 'udpm' uses zeromq when available, "
                                         "otherwise udpm. If none are declared, one named "
                                         "'default' is created."];
    optional goby.middleware.protobuf.PubSubTest test = 12;

    repeated string load_shared_library = 20 [(goby.field) = {
        description: "Load this shared library containing compiled Protobuf/DCCL messages.",
        cfg { cli_short: "l" env: "GOBY_TOOL_LOAD_SHARED_LIBRARY" }
    }];

    enum OutputFormat
    {
        HUMAN = 1;
        JSON = 2;
    }
    optional OutputFormat output_format = 30
        [default = HUMAN, (goby.field) = { cfg { cli_short: "o" } }];
    optional string output_file = 31
        [(goby.field).description = "Write the report here instead of stdout"];
}
