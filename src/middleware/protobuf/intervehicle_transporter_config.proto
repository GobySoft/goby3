syntax = "proto2";

import "dccl/option_extensions.proto";
import "goby/acomms/protobuf/buffer.proto";

package goby.middleware.intervehicle.protobuf;

message TransporterConfig
{
    repeated int32 publisher_id = 1
        [(dccl.field) = {min: 1 max: 30 max_repeat: 8 omit: true}];

    // unique id for intervehicle().subscribe within a given vehicle
    optional int32 subscriber_uuid = 2
        [default = 0, (dccl.field) = {min: 0, max: 7}];
    
    optional goby.acomms.protobuf.DynamicBufferConfig buffer = 10;

    optional bool broadcast = 20 [default = false];

    // metadata can be large, so limit how often it is resent until the portal has the type
    optional double metadata_interval = 30 [
        default = 5,
        (dccl.field) = {omit: true units {base_dimensions: "T" system: "si"}}
    ];

    // discard any queued messages of this type and group (to every destination) before
    // queuing this one; discarded messages are reported as EXPIRED_SUPERSEDED
    optional bool clear_pending = 40 [default = false, (dccl.field).omit = true];

    // subscriptions only: also publish each received message on the inner layer (e.g.
    // interprocess) in the subscribed group, so it can be logged or used by other subscribers
    optional bool republish_on_receive = 50 [default = false, (dccl.field).omit = true];
    
    // message LinkConfig
    // {
    //     enum LinkPolicy
    //     {
    //         // send to all links (until one acknowledges)
    //         LINK_POLICY_FLOOD_ALL = 1;

    //         // try the highest priority link for some period of time, then
    //         // try the next LINK_POLICY_PRIORITY_TIMEOUT = 2;
    //     }
    //     optional LinkPolicy policy = 1;
    // }

    // optional LinkConfig link = 20;
}
