# Advanced usage: several portals on one layer, distinguished by alias
application:
  name: MultiPortalDemo
  cpp_type: project::MultiPortalApplication
  config:
    scheme: PROTOBUF
    type: project.config.protobuf.MultiPortalDemoConfig

interprocess:
  - alias: interprocess_zeromq
    publishes:
      - group: project::groups::zmq_out
        scheme: PROTOBUF
        type: project.protobuf.ZmqOut
  - alias: interprocess_udpm
    subscribes:
      - group: project::groups::udpm_in
        scheme: PROTOBUF
        type: project.protobuf.UdpmIn
