# capacity belongs to the subscription whose queue it bounds, not to a publication
application:
  name: BadDemo
  cpp_type: goby::zeromq::SingleThreadApplication
  config:
    scheme: PROTOBUF
    type: project.config.protobuf.BadDemoConfig

interthread:
  publishes:
    - group: work
      scheme: NATIVE
      type: Work
      capacity: 10
