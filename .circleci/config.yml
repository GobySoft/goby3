## Pre-declare job templates
job-template-amd64: &job-template-amd64
  working_directory: /root/goby3
  resource_class: large
  steps:
    - checkout
    - run: &run-add-continuous-packages
        name: Add continuous build package sources.list (if not a tagged release)
        # TODO: Remove check for gobysoft.gpg once all Docker containers move off apt-key (resolute/trixie and newer)
        command: |
          [ -z "${CIRCLE_TAG}" ] &&
          (if [ -f /etc/apt/keyrings/gobysoft.gpg ]; then
          echo "deb [signed-by=/etc/apt/keyrings/gobysoft.gpg] http://packages.gobysoft.org/ubuntu/continuous/ ${DISTRO_RELEASE_CODENAME}/"
          else
          echo "deb http://packages.gobysoft.org/ubuntu/continuous/ ${DISTRO_RELEASE_CODENAME}/"
          fi >> /etc/apt/sources.list.d/gobysoft_continuous.list) || true
    - run: &run-update-apt
        name: Update apt packages
        # TODO: Remove libdccl5-dev from this command once all Docker containers are updated to include it
        command: |
          apt-get update
          apt-get dist-upgrade -y
          apt-get install libdccl5-dev:${TARGET_ARCH} libdccl5:${TARGET_ARCH} dccl5-compiler -y || true
    - run: &run-install-ccache
        name: Install ccache
        command: apt-get install -y ccache
    - restore_cache: &restore-ccache
        keys:
          - ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          - ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
          - ccache-v1-{{ .Environment.CIRCLE_JOB }}-
    - run: &run-build
        name: Build
        command: mkdir -p build && cd build && cmake -Denable_testing=ON -Dbuild_doc=ON -Dbuild_doc_pdf=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .. && cmake --build . -- -j4
    - run: &run-ccache-stats
        name: Show ccache statistics
        # zero afterwards so each build reports only its own hit rate
        command: ccache --show-stats && ccache --zero-stats
    - save_cache: &save-ccache
        key: ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
        paths:
          - /root/.ccache
    - run: &run-tests
        name: Run tests
        command: cd build && ctest --output-on-failure

job-template-deb-amd64: &job-template-deb-amd64
  <<: *job-template-amd64
  steps:
    - run: *run-add-continuous-packages
    - run: *run-update-apt
    - run: &run-import-gpg
        name: Import GPG key
        command: echo -e "$GPG_KEY" | gpg --import
    - attach_workspace: &attach-src-workspace
        at: /root/src
    - run: &run-extract-src
        name: Extract the original source tarball
        command: |
          cp /root/src/*.orig.tar.xz ${CIRCLE_WORKING_DIRECTORY}/.. &&
          tar xfJ ../*.orig.tar.xz --strip-components=1
    - run: &run-update-deb
        name: Update the debian source repo and pull the branch with the same name as the project branch (if it exists)
        command: |        
          cd /root/debian &&
          git reset --hard HEAD &&
          git pull --prune &&
          git checkout origin/${CIRCLE_BRANCH} ||
          echo "No branch in debian called ${CIRCLE_BRANCH}, using $(git rev-parse --abbrev-ref HEAD)"
    - run: &run-nest-deb
        name: Nest debian source into project source
        command: |
          mv /root/debian ${CIRCLE_WORKING_DIRECTORY} &&
          cp /root/src/changelog ${CIRCLE_WORKING_DIRECTORY}/debian &&
          sed -i "s/DISTRORELEASEVERSION/${DISTRO_RELEASE_VERSION}/;s/DISTRORELEASECODENAME/${DISTRO_RELEASE_CODENAME}/" ${CIRCLE_WORKING_DIRECTORY}/debian/changelog
    - run: &run-install-build-deps
        name: Install build dependencies the image does not already have
        # TODO: Remove once the Docker images are rebuilt and have the new (Python) dependencies.
        command: |
          mkdir -p /root/build-deps && cd /root/build-deps &&
          apt-get update &&
          case "${TARGET_ARCH}" in
            amd64) \
              mk-build-deps -t "apt-get -y --no-install-recommends -o Debug::pkgProblemResolver=yes" -i "${CIRCLE_WORKING_DIRECTORY}/debian/control" ;;
            *) \
              mk-build-deps --build-dep -a "${TARGET_ARCH}" --host-arch "${TARGET_ARCH}" --build-arch amd64 -t "apt-get -y --no-install-recommends -o Debug::pkgProblemResolver=yes" -i "${CIRCLE_WORKING_DIRECTORY}/debian/control" ;;
          esac
    - run: &run-patch-version
        name: Patch the version patch number automatically in CMakeLists.txt
        command: |
          export NEWVERSION="$(echo ../*.orig.tar.xz | sed 's/.*_\(.*\)\.orig\.tar\.xz/\1/')"
          quilt new 01-patch-version
          quilt add CMakeLists.txt
          export NEWVERSION_PATCH=$(echo $NEWVERSION | cut -d . -f 3)
          sed -i "s/^set(GOBY_VERSION_PATCH *\".*\"/set(GOBY_VERSION_PATCH \"${NEWVERSION_PATCH}\"/" CMakeLists.txt
          quilt refresh                  
    - run: &run-build-pkg
        name: Build the Debian package 
        command: |
          export DPKG_BUILDPACKAGE_BUILD_TYPE="-B"
          # default is to do source and binary build
          [[ "${DO_SOURCE_BUILD}" == "true" ]] && DPKG_BUILDPACKAGE_BUILD_TYPE=""        
          CONFIG_SITE=/etc/dpkg-cross/cross-config.${TARGET_ARCH} && dpkg-buildpackage -k19478082E2F8D3FE -a${TARGET_ARCH} ${DPKG_BUILDPACKAGE_BUILD_TYPE}
    - run: &run-store-next-build
        name: Store deb files for next build
        command: |
          mkdir -p /root/deb &&
          find .. -maxdepth 1 -type f -exec cp {}  /root/deb \; &&
          rm -f /root/deb/*-build-deps*.*
    - run: &run-store-for-artifacts
        name: Store deb files for storing artifacts
        command: mkdir -p /tmp/deb && cp /root/deb/* /tmp/deb
    - store_artifacts: &store
        path: /tmp/deb
    - run: &remove-orig-source
        name: Remove original source file to avoid conflicts in merging
        command: |        
          rm -f /root/deb/*.orig.tar.xz || true
    - persist_to_workspace: &persist-debs
        root: /root/deb
        paths:
          - '*.dsc'
          - '*.tar.xz'
          - '*.deb'
          - '*.ddeb'
          - '*.changes'
          - '*.buildinfo'
  
job-template-deb-cross: &job-template-deb-cross
  <<: *job-template-deb-amd64

# base sanitizer off Resolute build
job-template-sanitizers: &job-template-sanitizers
  <<: *job-template-amd64
  environment:
    <<: *environment-template-common
    <<: *environment-template-jammy
    <<: *environment-template-amd64
    SANITIZER_NUM_JOBS: 4
    TSAN_OPTIONS: "suppressions=/root/goby3/src/test/suppressions.tsan.txt history_size=6"
  docker: *docker-base-resolute

# Base upload off Noble build
job-template-upload: &job-template-upload
  <<: *job-template-amd64
  docker: *docker-base-resolute
  resource_class: small


  
# which branches to run the Debian build and upload on
filter-template-master-only: &filter-template-master-only
  filters:
    tags:
      only: /.*/
    branches:
      only:
        - "3.0"

filter-template-non-master: &filter-template-non-master
  filters:
    branches:
      ignore:
        - "3.0"
        
## Begin actual config
version: 2.1
workflows:
  commit:
    jobs:


      - amd64-tsan-build:
          <<: *filter-template-non-master
      - amd64-bookworm-build:        
          <<: *filter-template-non-master
      - amd64-trixie-build:
          <<: *filter-template-non-master
      - amd64-jammy-build:
          <<: *filter-template-non-master
      - amd64-noble-build:
          <<: *filter-template-non-master
      - amd64-resolute-build:
          <<: *filter-template-non-master
      - amd64-resolute-minimal-build:
          <<: *filter-template-non-master
      
      - get-orig-source:
          <<: *filter-template-master-only

      - amd64-bookworm-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - amd64-trixie-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - arm64-bookworm-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - arm64-trixie-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - armhf-bookworm-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - armhf-trixie-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source

      - amd64-jammy-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - arm64-jammy-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - armhf-jammy-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
            
      - amd64-noble-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - amd64-resolute-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - arm64-noble-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - arm64-resolute-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - armhf-noble-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
      - armhf-resolute-deb-build:
          <<: *filter-template-master-only
          requires:
            - get-orig-source
            
      # always do the continuous upload if we did the deb builds
      - continuous-upload:
          requires:
            - amd64-bookworm-deb-build
            - amd64-trixie-deb-build
            - arm64-bookworm-deb-build
            - arm64-trixie-deb-build
            - armhf-bookworm-deb-build
            - armhf-trixie-deb-build
            - amd64-jammy-deb-build
            - arm64-jammy-deb-build
            - armhf-jammy-deb-build
            - amd64-noble-deb-build
            - arm64-noble-deb-build
            - armhf-noble-deb-build
            - amd64-resolute-deb-build
            - arm64-resolute-deb-build
            - armhf-resolute-deb-build

      # only do the release upload on tagged builds
      - release-upload:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
          requires:
            - amd64-bookworm-deb-build
            - amd64-trixie-deb-build
            - arm64-bookworm-deb-build
            - arm64-trixie-deb-build
            - armhf-bookworm-deb-build
            - armhf-trixie-deb-build
            - amd64-jammy-deb-build
            - arm64-jammy-deb-build
            - armhf-jammy-deb-build
            - amd64-noble-deb-build
            - arm64-noble-deb-build
            - armhf-noble-deb-build
            - amd64-resolute-deb-build
            - arm64-resolute-deb-build
            - armhf-resolute-deb-build
            
      - amd64-scan-build:
          <<: *filter-template-master-only
      - amd64-asan-build:
          <<: *filter-template-master-only


#      - amd64-ubsan-build:
#          <<: *filter-template-master-only          
          
jobs:

  get-orig-source:
    <<: *job-template-deb-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
    steps:
      - checkout
      - run:
          name: Get original source tarball
          command: |
            # use long format for continuous builds so they always rank after release builds
            [ -z "${CIRCLE_TAG}" ] && export DESCRIBE_ARGS="--long" || export DESCRIBE_ARGS=""
            export NEWVERSION="$(git describe --tags HEAD ${DESCRIBE_ARGS} | sed 's/_/~/' | sed 's/-/+/g')"
            git config tar.tar.xz.command "xz -c" &&
            mkdir -p /root/src &&
            git archive --prefix=goby3-${NEWVERSION}/ -o /root/src/goby3_${NEWVERSION}.orig.tar.xz HEAD;
      - run:
          name: Add changelog entry 
          command: |
            cd .. &&
            export NEWVERSION="$(echo /root/src/*.orig.tar.xz | sed 's/.*_\(.*\)\.orig\.tar\.xz/\1/')"
            COMMENT="Autobuild for version ${NEWVERSION}" &&
            dch --newversion=${NEWVERSION}-0+gs+DISTRORELEASEVERSION -D DISTRORELEASECODENAME "${COMMENT}" &&
            cp debian/changelog /root/src
      - store_artifacts:
          path: /root/src
      - persist_to_workspace:
          root: /root/src
          paths:
            - '*.tar.xz'
            - 'changelog'

  amd64-bookworm-build:
    <<: *job-template-amd64
    docker: *docker-base-bookworm
    environment:
      <<: *environment-template-common
      <<: *environment-template-ccache
      <<: *environment-template-bookworm

  amd64-trixie-build:
    <<: *job-template-amd64
    docker: *docker-base-trixie
    environment:
      <<: *environment-template-common
      <<: *environment-template-ccache
      <<: *environment-template-trixie


  amd64-jammy-build:
    <<: *job-template-amd64
    docker: *docker-base-jammy
    environment:
      <<: *environment-template-common
      <<: *environment-template-ccache
      <<: *environment-template-jammy

  amd64-noble-build:
    <<: *job-template-amd64
    docker: *docker-base-noble
    environment:
      <<: *environment-template-common
      <<: *environment-template-ccache
      <<: *environment-template-noble

  amd64-resolute-build:
    <<: *job-template-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-ccache
      <<: *environment-template-resolute

  amd64-resolute-minimal-build:
    docker:
      - image: ubuntu:resolute
    resource_class: large
    working_directory: /root/goby3
    environment:
      <<: *environment-template-ccache
      DEBIAN_FRONTEND: "noninteractive"
      DEBIAN_PRIORITY: "critical"
    steps:
      - run:
          name: Install packages server
          command: |
            apt-get update && apt-get -y install dirmngr gpg
            export COMPONENT=release
            export GOBYSOFT_SIGNING_KEY=19478082E2F8D3FE
            install -d -m 0755 /etc/apt/keyrings
            gpg --keyserver keyserver.ubuntu.com --recv-keys ${GOBYSOFT_SIGNING_KEY} && gpg --export ${GOBYSOFT_SIGNING_KEY} >/etc/apt/keyrings/gobysoft.gpg
            echo "deb [signed-by=/etc/apt/keyrings/gobysoft.gpg] http://packages.gobysoft.org/$(. /etc/os-release; echo "$ID")/${COMPONENT}/ $(. /etc/os-release; echo "$VERSION_CODENAME")/" >/etc/apt/sources.list.d/gobysoft_${COMPONENT}.list
      - run:
          name: Install apt packages
          command: |
            apt-get update &&
            apt-get -y install ccache git build-essential cmake libboost-dev libboost-system-dev libboost-date-time-dev libboost-program-options-dev libboost-filesystem-dev libboost-process-dev libprotobuf-dev libprotoc-dev protobuf-compiler libproj-dev libdccl4-dev dccl4-compiler
      - checkout
      - restore_cache: *restore-ccache
      - run:
          name: Build
          command: mkdir -p build && cd build && cmake -Denable_testing=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .. && cmake --build . -- -j4
      - run: *run-ccache-stats
      - save_cache: *save-ccache
      - run: *run-tests

  amd64-bookworm-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-bookworm
    environment:
      <<: *environment-template-common
      <<: *environment-template-bookworm
      <<: *environment-template-amd64      
  arm64-bookworm-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-arm64-bookworm
    environment:
      <<: *environment-template-common
      <<: *environment-template-bookworm
      <<: *environment-template-arm64
  armhf-bookworm-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-armhf-bookworm
    environment:
      <<: *environment-template-common
      <<: *environment-template-bookworm
      <<: *environment-template-armhf
  amd64-trixie-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-trixie
    environment:
      <<: *environment-template-common
      <<: *environment-template-trixie
      <<: *environment-template-amd64
  arm64-trixie-deb-build:
    <<: *job-template-deb-cross
    docker: *docker-arm64-trixie
    environment:
      <<: *environment-template-common
      <<: *environment-template-trixie
      <<: *environment-template-arm64
  armhf-trixie-deb-build:
    <<: *job-template-deb-cross
    docker: *docker-armhf-trixie
    environment:
      <<: *environment-template-common
      <<: *environment-template-trixie
      <<: *environment-template-armhf
  amd64-jammy-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-jammy
    environment:
      <<: *environment-template-common
      <<: *environment-template-jammy
      <<: *environment-template-amd64
  arm64-jammy-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-arm64-jammy
    environment:
      <<: *environment-template-common
      <<: *environment-template-jammy
      <<: *environment-template-arm64
  armhf-jammy-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-armhf-jammy
    environment:
      <<: *environment-template-common
      <<: *environment-template-jammy
      <<: *environment-template-armhf
  amd64-noble-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-noble
    environment:
      <<: *environment-template-common
      <<: *environment-template-noble
      <<: *environment-template-amd64
  arm64-noble-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-arm64-noble
    environment:
      <<: *environment-template-common
      <<: *environment-template-noble
      <<: *environment-template-arm64
  armhf-noble-deb-build: 
    <<: *job-template-deb-cross
    docker: *docker-armhf-noble
    environment:
      <<: *environment-template-common
      <<: *environment-template-noble
      <<: *environment-template-armhf
  amd64-resolute-deb-build:
    <<: *job-template-deb-amd64
    docker: *docker-base-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
  arm64-resolute-deb-build:
    <<: *job-template-deb-cross
    docker: *docker-arm64-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-arm64
  armhf-resolute-deb-build:
    <<: *job-template-deb-cross
    docker: *docker-armhf-resolute
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-armhf
      
  amd64-scan-build:
    <<: *job-template-sanitizers
    steps:
      - checkout
      - run: *run-add-continuous-packages
      - run: *run-update-apt
      - run:
          name: Build with static analyzer
          command: |
            mkdir -p build && cd build &&
            scan-build --use-cc=/usr/bin/clang --use-c++=/usr/bin/clang++ cmake .. -Denable_testing=ON -DCMAKE_BUILD_TYPE=Debug -Denable_llvm=OFF &&
            scan-build --exclude /usr/include/boost --use-cc=/usr/bin/clang --use-c++=/usr/bin/clang++ --status-bugs cmake --build . -- -j${SANITIZER_NUM_JOBS}
      - run:
          name: Store static analyzer results
          command: cd /tmp && tar cfvz scan-build.tar.gz scan-build*
          when: on_fail
      - store_artifacts:
          path: /tmp/scan-build.tar.gz
          when: on_fail
  amd64-asan-build:
    <<: *job-template-sanitizers
    steps:
      - checkout
      - run: *run-add-continuous-packages
      - run: *run-update-apt
      - run:
          name: Build with AddressSanitizer (and LeakSanitizer)
          command: mkdir -p build && cd build && cmake -DSANITIZE_ADDRESS=ON -Denable_testing=ON -Denable_llvm=OFF .. && cmake --build . -- -j${SANITIZER_NUM_JOBS}
      - run: &run-tests-sanitizers
          name: Run tests
          command: cd build && ctest --output-on-failure
  amd64-tsan-build:
    # Use machine executor (not Docker) so we can set sysctl for ThreadSanitizer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: /home/circleci/goby3
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
      SANITIZER_NUM_JOBS: 4
    steps:
      - checkout
      - run:
          # Required to avoid "FATAL: ThreadSanitizer: unexpected memory mapping"
          # on Linux kernels >= 6.x. See https://stackoverflow.com/questions/77850769
          name: Set mmap_rnd_bits for ThreadSanitizer compatibility
          command: sudo sysctl vm.mmap_rnd_bits=28
      - restore_cache:
          keys:
            - ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
            - ccache-v1-{{ .Environment.CIRCLE_JOB }}-
      - run:
          name: Start build container
          command: |
            mkdir -p /home/circleci/ccache
            docker run -d --name tsan-build \
              -v /home/circleci/goby3:/root/goby3 \
              -v /home/circleci/ccache:/root/.ccache \
              -e TSAN_OPTIONS="suppressions=/root/goby3/src/test/suppressions.tsan.txt history_size=6" \
              -e CCACHE_DIR="/root/.ccache" \
              -e CCACHE_MAXSIZE="1G" \
              -e CCACHE_COMPILERCHECK="content" \
              gobysoft/goby3-ubuntu-build-base:26.04.1 \
              sleep infinity
            # Fix git "dubious ownership" (host checkout owned by circleci, container runs as root)
            docker exec tsan-build git config --global --add safe.directory /root/goby3
      - run:
          name: Add continuous build package sources.list in container (if not a tagged release)
          command: |
            [ -z "${CIRCLE_TAG}" ] &&
            docker exec tsan-build bash -c "echo 'deb [signed-by=/etc/apt/keyrings/gobysoft.gpg] http://packages.gobysoft.org/ubuntu/continuous/ ${DISTRO_RELEASE_CODENAME}/' >> /etc/apt/sources.list.d/gobysoft_continuous.list" ||
            true
      - run:
          name: Update apt packages in container
          command: docker exec tsan-build bash -c "apt-get update && apt-get dist-upgrade -y && apt-get install -y ccache"
      - run:
          name: Build with ThreadSanitizer
          command: docker exec tsan-build bash -c "mkdir -p /root/goby3/build && cd /root/goby3/build && cmake -DSANITIZE_THREAD=ON -Denable_testing=ON -Denable_llvm=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .. && cmake --build . -- -j${SANITIZER_NUM_JOBS}"
      - run:
          name: Show ccache statistics
          command: |
            docker exec tsan-build bash -c "ccache --show-stats && ccache --zero-stats"
            # the container writes the cache as root; save_cache runs as circleci
            sudo chown -R circleci:circleci /home/circleci/ccache
      - save_cache:
          key: ccache-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /home/circleci/ccache
      - run:
          name: Run tests
          command: docker exec tsan-build bash -c "cd /root/goby3/build && ctest --output-on-failure"
  amd64-ubsan-build:
    <<: *job-template-sanitizers
    steps:
      - checkout
      - run: *run-add-continuous-packages
      - run: *run-update-apt
      - run:
          name: Build with UndefinedBehaviorSanitizer
          command: mkdir -p build && cd build && cmake -DSANITIZE_UNDEFINED=ON -Denable_testing=ON  -Denable_llvm=OFF .. && cmake --build . -- -j${SANITIZER_NUM_JOBS}
      - run: *run-tests-sanitizers
  continuous-upload:
    <<: *job-template-upload
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
      UPLOAD_DESTINATION: "gobysoft-continuous"
    steps: &steps-upload
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "cd:15:c9:43:48:20:c9:56:58:9e:91:01:74:0d:fe:d2"
      - run: *run-import-gpg
      - attach_workspace:
          at: /root/deb
      - attach_workspace: *attach-src-workspace
      - run:
          name: Move original source into output directory
          command: mv /root/src/* /root/deb
      - run:
          name: Upload packages to packages.gobysoft.org
          command: |
            echo 'trusted-key A8E48CFF6650A07F6EF2B9AD19478082E2F8D3FE' >> ~/.gnupg/gpg.conf
            echo '|1|HjIjI40ko7XtgqXNK8DNuiVcy4Q=|7PEGcXNRmsj1tzGeRjb9UgWIWwE= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK8LmTLyo7inmKCa28F2JZBSpQFT1VrwnFpeV1v6PlQE' >> ~/.ssh/known_hosts
            for change_file in /root/deb/*.changes;
            do dput -c ${CIRCLE_WORKING_DIRECTORY}/.circleci/dput.cf ${UPLOAD_DESTINATION} $change_file;
            done
          

  release-upload:
    <<: *job-template-upload
    environment:
      <<: *environment-template-common
      <<: *environment-template-resolute
      <<: *environment-template-amd64
      UPLOAD_DESTINATION: "gobysoft-release"
    steps: *steps-upload
